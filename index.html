<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Emlékdoboz Tervező</title>

<style>

/* ------------------------------------------------------------
   FONT
------------------------------------------------------------ */
@font-face {
  font-family: "Always In My Heart";
  src: url("AlwaysInMyHeart.ttf") format("truetype");
}

/* ------------------------------------------------------------
   GLOBAL STYLE
------------------------------------------------------------ */
body {
  margin: 0;
  padding: 30px;
  background: #f4f4f6;
  font-family: system-ui, sans-serif;
  display: flex;
  gap: 40px;
}

/* ------------------------------------------------------------
   PREVIEW LEFT SIDE
------------------------------------------------------------ */
#previewWrapper {
  width: 760px;
  height: 520px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.15);
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

#previewCanvas {
  width: 700px;
  height: 470px;
  border-radius: 24px;
  background: #d9d9d9;
  position: relative;
  overflow: hidden;
}

#boxColorLayer {
  position: absolute;
  inset: 0;
  background: #e5e5e5;
}

#titleText {
  position: absolute;
  left: 50%;
  font-family: "Always In My Heart";
  color: #4b2e13;
  white-space: nowrap;
  pointer-events: none;
  z-index: 20;
  transform: translateX(-50%);
}

/* ------------------------------------------------------------
   DECOR ITEMS
------------------------------------------------------------ */
.decor {
  position: absolute;
  cursor: grab;
  z-index: 30;
}

.decor.selected {
  outline: 2px dashed rgba(0,0,0,0.45);
}

.decor svg {
  display: block;
}

.resize-handle {
  width: 14px;
  height: 14px;
  background: white;
  border: 2px solid black;
  border-radius: 50%;
  position: absolute;
  right: -7px;
  bottom: -7px;
  cursor: se-resize;
  display: none; /* alapból nem látszik */
}

#sizeBubble {
  position: absolute;
  padding: 6px 12px;
  background: black;
  color: white;
  border-radius: 6px;
  font-size: 12px;
  z-index: 999;
  display: none;
}

/* ------------------------------------------------------------
   CONTROL PANEL (RIGHT SIDE)
------------------------------------------------------------ */
#panel {
  width: 420px;
}

.section {
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  margin-bottom: 25px;
}

.section h3 {
  margin-top: 0;
}

.color-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.color-swatch {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
}

.color-swatch.selected {
  border-color: black;
}

#palette {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.palette-item {
  width: 64px;
  height: 64px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
}

.palette-item img {
  width: 42px;
}

/* PRINT – most csak tartaléknak marad benne */
@media print {
  body {
    padding: 0;
    margin: 0;
    display: block;
    background: white;
  }
  #panel {
    display: none;
  }
  #previewWrapper {
    box-shadow: none;
    width: 100%;
    height: auto;
    border-radius: 0;
    margin: 0;
  }
  #previewCanvas {
    width: 100%;
    height: auto;
    border-radius: 0;
  }
}

</style>
</head>

<body>

<!-- ------------------------------------------------------------
     BAL OLDAL: PREVIEW
------------------------------------------------------------ -->
<div id="previewWrapper">
  <div id="previewCanvas">
    <div id="boxColorLayer"></div>
    <div id="titleText">Nándi alkotásai</div>
  </div>
  <div id="sizeBubble"></div>
</div>

<!-- ------------------------------------------------------------
     JOBB OLDAL: PANEL
------------------------------------------------------------ -->
<div id="panel">

  <!-- FELIRAT -->
  <div class="section">
    <h3>Felirat</h3>
    <input id="titleInput" type="text" placeholder="Pl. Nándi alkotásai"
           style="width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;">

    <p style="margin-top:15px;">Méret: <span id="titleSizeLabel">2.0 cm</span></p>
    <input id="titleSize" type="range" min="0.5" max="6" step="0.1" value="2" style="width:100%">

    <p style="margin-top:15px;">Pozíció</p>
    <label><input type="radio" name="pos" value="center" checked> Középen</label><br>
    <label><input type="radio" name="pos" value="top"> Felső részben (3cm)</label><br>
    <label><input type="radio" name="pos" value="bottom"> Alsó részben (3cm)</label><br>

    <p style="margin-top:15px;">Felirat színe</p>
    <div class="color-grid" id="titleColorGrid"></div>
  </div>

  <!-- DOBOZ SZÍNE -->
  <div class="section">
    <h3>Doboz színe</h3>
    <div class="color-grid" id="boxColorGrid"></div>
  </div>

  <!-- MINTÁK -->
  <div class="section">
    <h3>Minták (fogd és húzd a dobozra)</h3>
    <div id="palette">
      <div class="palette-item" data-type="star_1"><img src="star_1.svg" alt=""></div>
      <div class="palette-item" data-type="star_2"><img src="star_2.svg" alt=""></div>
      <div class="palette-item" data-type="cloud_1"><img src="cloud_1.svg" alt=""></div>
      <div class="palette-item" data-type="cloud_2"><img src="cloud_2.svg" alt=""></div>
    </div>
  </div>

  <!-- MINTÁK SZÍNE -->
  <div class="section">
    <h3>Minták színe</h3>
    <p>Csoport:</p>
    <label><input type="radio" name="decoGroup" value="star" checked> Csillagok</label><br>
    <label><input type="radio" name="decoGroup" value="cloud"> Felhők</label>
    <div class="color-grid" id="decorColorGrid" style="margin-top:12px;"></div>
  </div>

  <button id="saveImgBtn" 
          style="width:100%;padding:14px;background:black;color:white;font-size:16px;border:none;border-radius:12px;cursor:pointer;">
    Kép mentése (PNG)
  </button>

</div>

<!-- html2canvas CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

/* ------------------------------------------------------------
   SZÍNEK – Pinty Plus Home
------------------------------------------------------------ */
const COLORS = [
  {hex:"#e5e5e5"}, {hex:"#6b7280"}, {hex:"#0ea5e9"}, {hex:"#1d4ed8"},
  {hex:"#111827"}, {hex:"#7c2d12"}, {hex:"#d6be8a"}, {hex:"#4b5563"},
  {hex:"#9cae9a"}, {hex:"#14532d"}, {hex:"#22c55e"}, {hex:"#eab308"},
  {hex:"#f9a8d4"}, {hex:"#a855f7"}
];

/* ------------------------------------------------------------
   SZÍN GRID
------------------------------------------------------------ */
function buildColorGrid(grid, callback){
  COLORS.forEach(c=>{
    let sw=document.createElement("div");
    sw.className="color-swatch";
    sw.style.background=c.hex;
    sw.onclick=()=>{
      grid.querySelectorAll(".color-swatch").forEach(x=>x.classList.remove("selected"));
      sw.classList.add("selected");
      callback(c);
    };
    grid.appendChild(sw);
  });
}

/* ------------------------------------------------------------
   FELIRAT LOGIKA
------------------------------------------------------------ */
const previewCanvas=document.getElementById("previewCanvas");
const titleInput=document.getElementById("titleInput");
const titleText=document.getElementById("titleText");
const titleSize=document.getElementById("titleSize");
const titleSizeLabel=document.getElementById("titleSizeLabel");

let titleColor=COLORS[4];   // indulásnak sötét

titleInput.oninput=updateTitle;
titleSize.oninput=()=>{titleSizeLabel.textContent=titleSize.value+" cm"; updateTitle();}
document.querySelectorAll("input[name='pos']").forEach(x=>x.onchange=updateTitle);

function updateTitle(){
  let txt=titleInput.value || "Nándi alkotásai";
  titleText.textContent=txt;

  let pxPerCm=previewCanvas.offsetHeight/22.5;
  titleText.style.fontSize=(titleSize.value*pxPerCm)+"px";
  titleText.style.color=titleColor.hex;

  let pos=document.querySelector("input[name='pos']:checked").value;

  if(pos==="center"){
    titleText.style.top="50%";
    titleText.style.transform="translate(-50%, -50%)";
  }
  else if(pos==="top"){
    let px=3*pxPerCm;
    titleText.style.top=px+"px";
    titleText.style.transform="translateX(-50%)";
  }
  else{
    let canvasH=previewCanvas.offsetHeight;
    let px=canvasH-(3*pxPerCm);
    titleText.style.top=(px-parseFloat(titleText.style.fontSize))+"px";
    titleText.style.transform="translateX(-50%)";
  }
}

buildColorGrid(document.getElementById("titleColorGrid"), c=>{titleColor=c; updateTitle();});

/* ------------------------------------------------------------
   DOBOZ SZÍN
------------------------------------------------------------ */
const boxColorLayer=document.getElementById("boxColorLayer");
buildColorGrid(document.getElementById("boxColorGrid"), c=>{
  boxColorLayer.style.background=c.hex;
});

/* ------------------------------------------------------------
   SVG BETÖLTŐ (csak egyszer töltjük le fájlonként)
------------------------------------------------------------ */
const SVG_SOURCES = {
  star_1: "star_1.svg",
  star_2: "star_2.svg",
  cloud_1: "cloud_1.svg",
  cloud_2: "cloud_2.svg"
};

const svgCache = {};

async function loadSvg(type){
  if(svgCache[type]) return svgCache[type];
  const resp = await fetch(SVG_SOURCES[type]);
  const text = await resp.text();
  const tmp = document.createElement("div");
  tmp.innerHTML = text.trim();
  const svg = tmp.querySelector("svg");
  svgCache[type] = svg;
  return svg;
}

/* ------------------------------------------------------------
   DEKOROK DRAG & DROP
------------------------------------------------------------ */
let draggedType=null;
let activeDecor=null;
let sizeBubble=document.getElementById("sizeBubble");

document.querySelectorAll(".palette-item").forEach(item=>{
  item.onmousedown=e=>{
    draggedType=item.dataset.type;
  };
});

previewCanvas.addEventListener("mouseup", async e=>{
  if(draggedType){
    await createDecor(draggedType,e.offsetX,e.offsetY);
    draggedType=null;
  }
});

async function createDecor(type,x,y){
  const baseSvg = await loadSvg(type);
  const d=document.createElement("div");
  d.className="decor";
  d.dataset.kind = type.startsWith("star") ? "star" : "cloud";
  d.style.left=x+"px";
  d.style.top=y+"px";

  const svg=baseSvg.cloneNode(true);
  svg.style.width="80px";
  svg.style.height="auto";
  d.appendChild(svg);

  const h=document.createElement("div");
  h.className="resize-handle";
  d.appendChild(h);

  d.onmousedown=selectDecor;
  h.onmousedown=startResize;

  previewCanvas.appendChild(d);
}

function selectDecor(e){
  if(e.target.classList.contains("resize-handle")) return;

  document.querySelectorAll(".decor").forEach(d=>{
    d.classList.remove("selected");
  });

  activeDecor=e.currentTarget;
  activeDecor.classList.add("selected");

  const handle = activeDecor.querySelector(".resize-handle");
  if(handle) handle.style.display="block";

  const rect = activeDecor.getBoundingClientRect();
  const canvasRect = previewCanvas.getBoundingClientRect();
  const offsetX=e.pageX-rect.left;
  const offsetY=e.pageY-rect.top;

  function move(ev){
    activeDecor.style.left=(ev.pageX-canvasRect.left-offsetX)+"px";
    activeDecor.style.top=(ev.pageY-canvasRect.top-offsetY)+"px";
  }
  function stop(){
    const hndl = activeDecor.querySelector(".resize-handle");
    if(hndl) hndl.style.display="none";
    window.removeEventListener("mousemove",move);
    window.removeEventListener("mouseup",stop);
  }
  window.addEventListener("mousemove",move);
  window.addEventListener("mouseup",stop);
}

function startResize(e){
  e.stopPropagation();
  if(!activeDecor) activeDecor = e.currentTarget.parentElement;
  const svg=activeDecor.querySelector("svg");
  const handle=activeDecor.querySelector(".resize-handle");
  if(handle) handle.style.display="block";

  const startX=e.pageX;
  const startW=svg.getBoundingClientRect().width;
  const pxPerCm=previewCanvas.offsetHeight/22.5;

  function resize(ev){
    const diff=ev.pageX-startX;
    let newW=startW+diff;
    if(newW<20) newW=20;
    svg.style.width=newW+"px";

    const cm=(newW/pxPerCm).toFixed(1);
    sizeBubble.textContent=cm+" cm";
    sizeBubble.style.left=(ev.pageX+15)+"px";
    sizeBubble.style.top=ev.pageY+"px";
    sizeBubble.style.display="block";
  }

  function stop(){
    sizeBubble.style.display="none";
    if(handle) handle.style.display="none";
    window.removeEventListener("mousemove",resize);
    window.removeEventListener("mouseup",stop);
  }

  window.addEventListener("mousemove",resize);
  window.addEventListener("mouseup",stop);
}

/* ------------------------------------------------------------
   MINTÁK SZÍNE – CSOPORTOS
------------------------------------------------------------ */
let decorColorTarget="star";
document.querySelectorAll("input[name='decoGroup']").forEach(r=>{
  r.onchange=()=>{decorColorTarget=r.value;};
});

buildColorGrid(document.getElementById("decorColorGrid"), c=>{
  const col=c.hex;
  document.querySelectorAll(`.decor[data-kind='${decorColorTarget}'] svg`).forEach(svg=>{
    svg.querySelectorAll("*").forEach(node=>{
      if(node.tagName.toLowerCase() !== "svg"){
        node.setAttribute("fill", col);
        if(node.hasAttribute("stroke")) node.setAttribute("stroke", col);
      }
    });
  });
});

/* ------------------------------------------------------------
   PNG MENTÉS – html2canvas
------------------------------------------------------------ */
document.getElementById("saveImgBtn").onclick = () => {
  html2canvas(previewCanvas, {
    useCORS: true,
    backgroundColor: null
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "emlekdoboz.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }).catch(err => {
    alert("Ha üres képet kapsz, futtasd az oldalt webszerverről (pl. feltöltve a tárhelyre, vagy VS Code Live Serverrel).");
    console.error(err);
  });
};

updateTitle();

</script>

</body>
</html>
