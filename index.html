<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>Emlékdoboz tervező</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Oldalsó vezérlőpanel -->
    <aside class="sidebar">
      <h1 class="app-title">Emlékdoboz tervező</h1>

      <!-- Felirat blokk -->
      <section class="panel-section">
        <h2>Felirat</h2>

        <label class="field-label" for="title-input">Felirat szövege</label>
        <input
          id="title-input"
          type="text"
          placeholder="Írd ide a feliratot..."
        />

        <label class="field-label" for="title-size">Felirat magasság (cm)</label>
        <div class="field-row">
          <input
            id="title-size"
            type="number"
            min="3"
            max="7"
            value="4"
            readonly
          />
          <span class="field-unit">cm</span>
        </div>

        <div class="palette-block">
          <div class="palette-title">Felirat színe</div>
          <div id="title-palette" class="color-palette"></div>
        </div>
      </section>

      <!-- Minták blokk – jelenleg csak Ünnepek -->
      <section class="panel-section">
        <h2>Minták</h2>

        <!-- ÜNNEPEK TÉMA -->
        <div class="pattern-category collapsed">
          <button class="pattern-category-header" type="button">
            <span>Ünnepek</span>
            <span class="pattern-category-arrow">▾</span>
          </button>
          <div class="pattern-category-body">
            <div class="pattern-grid">
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/halloween_tok.svg" alt="Halloween tök" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/husvet_nyuszi.svg" alt="Húsvéti nyuszi" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/husvet_repa.svg" alt="Húsvéti répa" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/husvet_tojas.svg" alt="Húsvéti tojás 1" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/husvet_tojas2.svg" alt="Húsvéti tojás 2" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/kar_hoember.svg" alt="Karácsonyi hóember" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_csaladozike.svg" alt="Karácsonyi családozike" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_diotoro1.svg" alt="Diótörő 1" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_diotoro2.svg" alt="Diótörő 2" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_fagyongy.svg" alt="Fagyöngy" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_kacsak.svg" alt="Karácsonyi kacsák" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_maci.svg" alt="Karácsonyi maci" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_mokus.svg" alt="Karácsonyi mókus" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_nyaloka.svg" alt="Nyalóka" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_nyuszi.svg" alt="Karácsonyi nyuszi" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_ozike.svg" alt="Karácsonyi őzike" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_ozikepar.svg" alt="Őzike pár" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_roka.svg" alt="Karácsonyi róka 1" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_roka2.svg" alt="Karácsonyi róka 2" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/Unnepek/karacsony_szan.svg" alt="Karácsonyi szán" />
              </button>
            </div>
          </div>
        </div>

        <div class="palette-block">
          <div class="palette-title">Minták színe (gravír tónus)</div>
          <div id="pattern-palette" class="color-palette"></div>
        </div>

        <button id="flip-pattern-btn" class="secondary-btn" type="button">
          Minta tükrözése (bal ↔ jobb)
        </button>

        <button id="rotate-pattern-btn" class="secondary-btn" type="button">
          Minta forgatása 90°
        </button>

        <button id="delete-pattern-btn" class="secondary-btn" type="button">
          Kijelölt minta törlése
        </button>
        <div class="hint-text">
          Tipp: Del / Backspace törlés, Ctrl+C / Ctrl+V másolás
        </div>
      </section>

      <!-- Mentés -->
      <section class="panel-section">
        <h2>Mentés</h2>
        <button id="export-btn" class="primary-btn" type="button">
          Terv mentése (PNG)
        </button>
        <button id="export-csv-btn" class="secondary-btn" type="button">
          Méretek mentése (CSV)
        </button>
        <div class="hint-text">
          A PNG a látványtervet menti, a CSV a felirat és minták méretét, színét (színnévvel).
        </div>
      </section>
    </aside>

    <!-- Munkaterület -->
    <main class="workspace">
      <div class="workspace-inner">
        <div id="box-wrapper">
          <div id="box">
            <!-- Tartalmi rétegek (fa háttér CSS-ből jön) -->
            <div id="patterns-layer"></div>
            <div id="title-layer">
              <div id="title-box">
                <span id="title-text">Felirat</span>
                <div class="resize-handle title-resize"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
