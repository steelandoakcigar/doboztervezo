<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>EmlékdoBoz tervező</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Oldalsó vezérlőpanel -->
    <aside class="sidebar">
      <h1 class="app-title">Emlékdoboz tervező</h1>

      <!-- Felirat blokk -->
      <section class="panel-section">
        <h2>Felirat</h2>
        <label class="field-label" for="title-input">Felirat szövege</label>
        <input id="title-input" type="text" placeholder="Írd ide a feliratot..." />

        <label class="field-label" for="title-size">Felirat méret (cm)</label>
        <div class="field-row">
          <input id="title-size" type="number" min="3" max="7" value="4" />
          <span class="field-unit">cm</span>
        </div>

        <div class="palette-block">
          <div class="palette-title">Felirat színe</div>
          <div id="title-palette" class="color-palette"></div>
        </div>
      </section>

      <!-- Minták blokk – témákra bontva, nyilas összecsukással -->
      <section class="panel-section">
        <h2>Minták</h2>

        <!-- ÉGITESTEK TÉMA -->
        <div class="pattern-category">
          <button class="pattern-category-header" type="button">
            <span>Égitestek</span>
            <span class="pattern-category-arrow">▾</span>
          </button>
          <div class="pattern-category-body">
            <div class="pattern-grid">
              <button class="pattern-btn" type="button">
                <img src="icons/cloud_1.svg" alt="Felhő 1" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/cloud_2.svg" alt="Felhő 2" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/star_1.svg" alt="Csillag 1" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/star_2.svg" alt="Csillag 2" />
              </button>
            </div>
          </div>
        </div>

        <!-- KALÓZOS / TENGERI TÉMA -->
        <div class="pattern-category">
          <button class="pattern-category-header" type="button">
            <span>Kalózos / tengeri</span>
            <span class="pattern-category-arrow">▾</span>
          </button>
          <div class="pattern-category-body">
            <div class="pattern-grid">
              <button class="pattern-btn" type="button">
                <img src="icons/anchor.svg" alt="Horgony" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/ship.svg" alt="Hajó" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/wheel.svg" alt="Kormánykerék" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/starfish.svg" alt="Tengeri csillag" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/whale.svg" alt="Bálna" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/turtle.svg" alt="Teknős" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/shark.svg" alt="Cápa" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/sword.svg" alt="Kard" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/pirate_hat.svg" alt="Kalóz kalap" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/skull.svg" alt="Koponya" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/bones.svg" alt="Csontok" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/skeleton.svg" alt="Csontváz" />
              </button>
            </div>
          </div>
        </div>

        <div class="palette-block">
          <div class="palette-title">Minták színe</div>
          <div id="pattern-palette" class="color-palette"></div>
        </div>

        <button id="delete-pattern-btn" class="secondary-btn" type="button">
          Kijelölt minta törlése
        </button>
        <div class="hint-text">
          Tipp: Del / Backspace törlés, Ctrl+C / Ctrl+V másolás
        </div>
      </section>

      <!-- Doboz színezés -->
      <section class="panel-section">
        <h2>Doboz színezés</h2>
        <div class="palette-block">
          <div class="palette-title">Doboz alapszín</div>
          <div id="box-palette" class="color-palette"></div>
        </div>
        <button id="export-btn" class="primary-btn" type="button">
          PNG export
        </button>
      </section>
    </aside>

    <!-- Munkaterület -->
    <main class="workspace">
      <div class="workspace-inner">
        <div id="box-wrapper">
          <div id="box">
            <div id="patterns-layer"></div>
            <div id="title-layer">
              <span id="title-text">Felirat</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
