<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>Emlékdoboz tervező</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Oldalsó vezérlőpanel -->
    <aside class="sidebar">
      <h1 class="app-title">Emlékdoboz tervező</h1>

      <!-- Felirat blokk -->
      <section class="panel-section">
        <h2>Felirat</h2>
        <label class="field-label" for="title-input">Felirat szövege</label>
        <input id="title-input" type="text" placeholder="Írd ide a feliratot..." />

        <label class="field-label" for="title-size">Felirat méret (cm)</label>
        <div class="field-row">
          <input id="title-size" type="number" min="3" max="7" value="4" />
          <span class="field-unit">cm</span>
        </div>

        <div class="palette-block">
          <div class="palette-title">Felirat színe</div>
          <div id="title-palette" class="color-palette"></div>
        </div>
      </section>

      <!-- Minták blokk -->
      <section class="panel-section">
        <h2>Minták</h2>
        <div class="pattern-buttons">
          <button class="pattern-btn" type="button" data-icon="cloud1">
            <img src="icons/cloud_1.svg" alt="Felhő 1" />
          </button>
          <button class="pattern-btn" type="button" data-icon="cloud2">
            <img src="icons/cloud_2.svg" alt="Felhő 2" />
          </button>
          <button class="pattern-btn" type="button" data-icon="star1">
            <img src="icons/star_1.svg" alt="Csillag 1" />
          </button>
          <button class="pattern-btn" type="button" data-icon="star2">
            <img src="icons/star_2.svg" alt="Csillag 2" />
          </button>
        </div>

        <div class="palette-block">
          <div class="palette-title">Minták színe</div>
          <div id="pattern-palette" class="color-palette"></div>
        </div>
      </section>

      <!-- Doboz színezés -->
      <section class="panel-section">
        <h2>Doboz színezés</h2>
        <div class="palette-block">
          <div class="palette-title">Doboz alapszín</div>
          <div id="box-palette" class="color-palette"></div>
        </div>
        <button id="export-btn" class="primary-btn" type="button">
          PNG export
        </button>
      </section>
    </aside>

    <!-- Munkaterület -->
    <main class="workspace">
      <div class="workspace-inner">
        <div id="box-wrapper">
          <div id="box">
            <!-- akril overlay -->
            <div id="box-tint-layer"></div>

            <!-- minták -->
            <div id="patterns-layer"></div>

            <!-- felirat -->
            <div id="title-layer">
              <span id="title-text">Felirat</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
