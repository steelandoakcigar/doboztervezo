<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>Emlékdoboz tervező</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Oldalsó vezérlőpanel -->
    <aside class="sidebar">
      <h1 class="app-title">Emlékdoboz tervező</h1>

      <!-- Felirat blokk -->
      <section class="panel-section">
        <h2>Felirat</h2>
        <label class="field-label" for="title-input">Felirat szövege</label>
        <input id="title-input" type="text" placeholder="Írd ide a feliratot..." />

        <label class="field-label" for="title-size">Felirat magasság (cm)</label>
        <div class="field-row">
          <input
            id="title-size"
            type="number"
            min="3"
            max="7"
            value="4"
            readonly
          />
          <span class="field-unit">cm</span>
        </div>

        <div class="palette-block">
          <div class="palette-title">Felirat színe</div>
          <div id="title-palette" class="color-palette"></div>
        </div>
      </section>

      <!-- Minták blokk – témákra bontva, nyilas összecsukással -->
      <section class="panel-section">
        <h2>Minták</h2>

        <!-- ÉGITESTEK TÉMA -->
        <div class="pattern-category">
          <button class="pattern-category-header" type="button">
            <span>Égitestek</span>
            <span class="pattern-category-arrow">▾</span>
          </button>
          <div class="pattern-category-body">
            <div class="pattern-grid">
              <button class="pattern-btn" type="button">
                <img src="icons/cloud_1.svg" alt="Felhő 1" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/cloud_2.svg" alt="Felhő 2" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/star_1.svg" alt="Csillag 1" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/star_2.svg" alt="Csillag 2" />
              </button>
            </div>
          </div>
        </div>

        <!-- KALÓZOS / TENGERI TÉMA -->
        <div class="pattern-category">
          <button class="pattern-category-header" type="button">
            <span>Kalózos / tengeri</span>
            <span class="pattern-category-arrow">▾</span>
          </button>
          <div class="pattern-category-body">
            <div class="pattern-grid">
              <button class="pattern-btn" type="button">
                <img src="icons/anchor.svg" alt="Horgony" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/ship.svg" alt="Hajó" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/wheel.svg" alt="Kormánykerék" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/starfish.svg" alt="Tengeri csillag" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/whale.svg" alt="Bálna" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/turtle.svg" alt="Teknős" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/shark.svg" alt="Cápa" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/sword.svg" alt="Kard" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/pirate_hat.svg" alt="Kalóz kalap" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/skull.svg" alt="Koponya" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/bones.svg" alt="Csontok" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/skeleton.svg" alt="Csontváz" />
              </button>
            </div>
          </div>
        </div>

        <!-- BABYGIRL TÉMA -->
        <div class="pattern-category">
          <button class="pattern-category-header" type="button">
            <span>Babygirl</span>
            <span class="pattern-category-arrow">▾</span>
          </button>
          <div class="pattern-category-body">
            <div class="pattern-grid">
              <button class="pattern-btn" type="button">
                <img src="icons/masni.svg" alt="Masni" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/pillango.svg" alt="Pillangó" />
              </button>

              <button class="pattern-btn" type="button">
                <img src="icons/sziv1.svg" alt="Szív 1" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/sziv2.svg" alt="Szív 2" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/sziv3.svg" alt="Szív 3" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/sziv4.svg" alt="Szív 4" />
              </button>

              <button class="pattern-btn" type="button">
                <img src="icons/unicornis1.svg" alt="Unikornis" />
              </button>

              <button class="pattern-btn" type="button">
                <img src="icons/virag1.svg" alt="Virág 1" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/virag2.svg" alt="Virág 2" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/virag3.svg" alt="Virág 3" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/virag4.svg" alt="Virág 4" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/virag5.svg" alt="Virág 5" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/virag6.svg" alt="Virág 6" />
              </button>
              <button class="pattern-btn" type="button">
                <img src="icons/virag7.svg" alt="Virág 7" />
              </button>
            </div>
          </div>
        </div>

        <div class="palette-block">
          <div class="palette-title">Minták színe</div>
          <div id="pattern-palette" class="color-palette"></div>
        </div>

        <!-- ÚJ GOMBOK: tükrözés + forgatás -->
        <button id="flip-pattern-btn" class="secondary-btn" type="button">
          Minta tükrözése (bal ↔ jobb)
        </button>

        <button id="rotate-pattern-btn" class="secondary-btn" type="button">
          Minta forgatása 90°
        </button>

        <button id="delete-pattern-btn" class="secondary-btn" type="button">
          Kijelölt minta törlése
        </button>
        <div class="hint-text">
          Tipp: Del / Backspace törlés, Ctrl+C / Ctrl+V másolás
        </div>
      </section>

      <!-- Mentés -->
      <section class="panel-section">
        <h2>Mentés</h2>
        <button id="export-btn" class="primary-btn" type="button">
          Terv mentése (PNG)
        </button>
        <button id="export-csv-btn" class="secondary-btn" type="button">
          Méretek mentése (CSV)
        </button>
        <div class="hint-text">
          A PNG a látványtervet menti, a CSV a felirat és minták méretét, színét (színnévvel).
        </div>
      </section>
    </aside>

    <!-- Munkaterület -->
    <main class="workspace">
      <div class="workspace-inner">
        <div id="box-wrapper">
          <div id="box">
            <!-- CSAK a tartalmi rétegek: a fa háttér CSS-ből jön -->
            <div id="patterns-layer"></div>
            <div id="title-layer">
              <div id="title-box">
                <span id="title-text">Felirat</span>
                <div class="resize-handle title-resize"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
